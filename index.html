<!doctype html>



<html lang="vi">



<head>



<meta charset="utf-8">



<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">



<meta name="theme-color" content="#07090f">



<title>Beginner Plan - Những bài tập dành cho người mới.</title>



</head>



<body>



<!--APP-START-->



<style>



/* ============ TOKENS — dark-only, cam kết theo ảnh gốc ============ */



:root{



  --bg:#07090f;



  --surface:#12151f;



  --surface-2:#181c2a;



  --surface-3:#1f2434;



  --border:#242a3b;



  --border-soft:#1b2030;



  --ink:#eef1f8;



  --ink-2:#969db1;



  --ink-3:#5d6478;



  --accent:#d9f74a;



  --accent-soft:rgba(217,247,74,.12);



  --accent-ink:#131505;



  --push:#ff4d5e;   --push-soft:rgba(255,77,94,.14);



  --pull:#3da5ff;   --pull-soft:rgba(61,165,255,.14);



  --legs:#b45cff;   --legs-soft:rgba(180,92,255,.14);



  --an:#41d98a;     --an-soft:rgba(65,217,138,.14);



  --plan:#ffb648;   --plan-soft:rgba(255,182,72,.14);



  --danger:#ff5d5d;



  --r-lg:20px; --r-md:14px; --r-sm:9px;



  --muscle-primary:#ff4b55;



  --muscle-secondary:#ff9f43;



  font-size:16px;



}



*{box-sizing:border-box;margin:0;padding:0}



html,body{height:100%}



body{



  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;



  background:var(--bg);



  color:var(--ink);



  -webkit-font-smoothing:antialiased;



  line-height:1.5;



}



#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;opacity:.85}



.app{



  max-width:520px;margin:0 auto;min-height:100dvh;position:relative;z-index:1;



  background:



    radial-gradient(56% 20% at 50% -3%, rgba(217,247,74,.09), transparent 70%),



    radial-gradient(42% 16% at 110% 26%, rgba(61,165,255,.06), transparent 70%),



    radial-gradient(48% 18% at -10% 60%, rgba(180,92,255,.055), transparent 70%),



    transparent;



  padding-bottom:calc(76px + env(safe-area-inset-bottom));



}



::-webkit-scrollbar{width:9px;height:9px}



::-webkit-scrollbar-thumb{background:#232a3b;border-radius:99px;border:2px solid var(--bg)}



::-webkit-scrollbar-track{background:transparent}



.ic{vertical-align:-3px;flex:0 0 auto}



@media(min-width:560px){



  body{background:#04060b}



  .app{box-shadow:0 0 0 1px var(--border-soft),0 30px 80px rgba(0,0,0,.6)}



}



button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}



input,select{font:inherit}



::selection{background:var(--accent);color:var(--accent-ink)}



:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}



@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}



/* ============ HERO ============ */



.hero{padding:20px 18px 8px;position:relative}



.brand{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}



.brand .logo{width:44px;height:44px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}



.brand img.logo{object-fit:contain}



.side-brand{display:none}



.brand .bt b{display:block;font-size:.95rem;font-weight:900;letter-spacing:.16em;line-height:1.1}



.brand .bt span{display:block;font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}



.gym-info{



  display:flex;flex-direction:column;gap:9px;width:100%;



  padding:11px 13px;border-radius:14px;



  background:linear-gradient(180deg,#1b2030,#12151f);



  border:1px solid var(--border);



  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 18px rgba(0,0,0,.25)



}



.brand .gym-info{flex:0 0 100%;margin-top:4px}



.gym-info .gi-row{



  display:flex;align-items:flex-start;gap:8px;color:var(--ink-2)!important;text-decoration:none;



  line-height:1.4;text-transform:none!important;letter-spacing:normal!important;font-weight:500;font-size:.7rem



}



.gym-info .gi-row:hover{color:var(--ink)!important}



.gym-info .gi-row .ic{flex:0 0 auto;margin-top:1px}



.gym-info .gi-row span{flex:1;text-transform:none!important;letter-spacing:normal!important}



.gym-info .gi-row:nth-child(1) .ic{color:#d9f74a;filter:drop-shadow(0 0 5px rgba(217,247,74,.7))}



.gym-info .gi-row:nth-child(2) .ic{color:#4bacff;filter:drop-shadow(0 0 5px rgba(75,172,255,.7))}



.gym-info .gi-row:nth-child(3) .ic{color:#45e094;filter:drop-shadow(0 0 5px rgba(69,224,148,.7))}



.gym-info .gi-row:nth-child(1):hover span{color:#f4ff8e;text-shadow:0 0 10px rgba(217,247,74,.55)}



.gym-info .gi-row:nth-child(2):hover span{color:#9ed1ff;text-shadow:0 0 10px rgba(75,172,255,.55)}



.gym-info .gi-row:nth-child(3):hover span{color:#8af0c1;text-shadow:0 0 10px rgba(69,224,148,.55)}



.hero-notes{margin-top:12px;max-width:560px}



.hero-notes .gi-row{font-size:.7rem}



.hero-notes .gi-row:nth-child(1) .ic{color:#ffb648;filter:drop-shadow(0 0 5px rgba(255,182,72,.7))}



.hero-notes .gi-row:nth-child(2) .ic{color:#c3f04c;filter:drop-shadow(0 0 5px rgba(195,240,76,.7))}



.hero-notes .gi-row:nth-child(1):hover span{color:#ffd08a;text-shadow:0 0 10px rgba(255,182,72,.55)}



.hero-notes .gi-row:nth-child(2):hover span{color:#e3ffa0;text-shadow:0 0 10px rgba(195,240,76,.55)}



.hero .eyebrow{



  font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink-2)



}



.hero h1{



  font-size:2.15rem;line-height:1.1;font-weight:900;letter-spacing:-.02em;



  background:linear-gradient(98deg,#f4ff8e 5%,var(--accent) 45%,#9edc1f 90%);



  -webkit-background-clip:text;background-clip:text;color:transparent;



  filter:drop-shadow(0 3px 16px rgba(217,247,74,.16));



  text-wrap:balance;margin-top:3px;padding-bottom:2px



}



.hero .sub{margin-top:8px;color:var(--ink-2);font-size:.86rem}



.hero .sub b{color:var(--ink);font-weight:600}



.btn-gear{



  position:absolute;top:18px;right:14px;width:42px;height:42px;border-radius:14px;



  background:linear-gradient(180deg,var(--surface-3),var(--surface));border:1px solid var(--border);



  display:grid;place-items:center;color:var(--ink-2);



  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 4px 12px rgba(0,0,0,.3);



  transition:transform .2s, color .2s



}



.btn-gear:active{transform:scale(.92)}



.btn-gear:hover{color:var(--accent)}



/* ============ STAT TILES ============ */



.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 4px}



.stat{



  background:linear-gradient(180deg,#1b2030,#12151f);



  border:1px solid var(--border);border-radius:16px;



  padding:14px 12px 11px;text-align:center;



  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 24px rgba(0,0,0,.25)



}



.stat .v{



  font-size:1.42rem;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;



  color:var(--sc,var(--accent));text-shadow:0 0 24px color-mix(in srgb, currentColor 32%, transparent)



}



.st-kcal{--sc:#d9f74a}.st-pro{--sc:#45e094}.st-time{--sc:#4bacff}.st-bmi{--sc:#c3f04c}



.stat .sic,.stat .deco{display:none}



.hgreet{display:none}



.lbld{display:none}



.side-settings{display:none}



.side-stats{display:none}



.stat .l{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}



.stat .why{



  margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-soft);



  font-size:.62rem;line-height:1.45;color:var(--ink-3);font-weight:500;letter-spacing:0;text-transform:none;



  text-align:left



}



.stat .why b{color:var(--ink-2);font-weight:700}



/* ============ PROGRESS ============ */



.progress{padding:14px 18px 6px;display:flex;align-items:center;gap:12px}



.progress.is-hidden{display:none !important}



.progress .track{flex:1;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}



.progress .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#aee830,var(--accent));box-shadow:0 0 12px rgba(217,247,74,.55);transition:width .5s cubic-bezier(.2,.8,.2,1)}



.progress .txt{font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}



/* ============ TAB BAR (top) ============ */



.tabs{



  position:sticky;top:0;z-index:40;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;



  padding:10px 12px 0;background:linear-gradient(180deg,var(--bg) 78%,transparent);



  backdrop-filter:blur(8px)



}



.tabs::-webkit-scrollbar{display:none}



.tab{



  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px 10px;



  font-size:.9rem;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap



}



.tab .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}



.tab .ico{font-size:1rem}



.tab.active{color:var(--ink);border-bottom-color:var(--accent)}



.tab.active .lbl{color:var(--ink)}



.dot-push{background:radial-gradient(circle at 33% 30%,#ff97a0,var(--push) 62%,#8e1220);box-shadow:0 2px 6px rgba(255,77,94,.45)}



.dot-pull{background:radial-gradient(circle at 33% 30%,#9ed1ff,var(--pull) 62%,#0d4d92);box-shadow:0 2px 6px rgba(61,165,255,.45)}



.dot-legs{background:radial-gradient(circle at 33% 30%,#dcb2ff,var(--legs) 62%,#5c1d96);box-shadow:0 2px 6px rgba(180,92,255,.45)}



/* ============ SECTIONS ============ */



.section{display:none;padding:8px 16px 28px;animation:fadeUp .28s ease}



.section.active{display:block}



@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}



.section h2{font-size:1.62rem;font-weight:900;letter-spacing:-.01em;margin:14px 0 4px}



.section .lead{color:var(--ink-2);font-size:.9rem;margin-bottom:16px}



.section .lead b{color:var(--ink);font-weight:600}



/* ============ WEEK GRID ============ */



.week{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}



.day{



  background:linear-gradient(168deg, color-mix(in srgb, var(--c, #232a3b) 13%, var(--surface)), var(--surface) 58%);



  border:1px solid color-mix(in srgb, var(--c, #242a3b) 28%, var(--border));



  border-radius:var(--r-md);



  padding:10px 8px 9px;position:relative;overflow:hidden;min-height:96px;



  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);



  display:block;width:100%;text-align:left



}



.day::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,transparent)}



.day .dn{font-size:.62rem;font-weight:700;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}



.day .t{font-size:.82rem;font-weight:800;color:var(--c,var(--ink));margin-top:3px;letter-spacing:.02em}



.day .m{font-size:.66rem;color:var(--ink-2);margin-top:3px;line-height:1.35}



.day .al{font-size:.68rem;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}



.day.rest{opacity:.55}



.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 0 18px rgba(217,247,74,.18)}



.day.today .dn{color:var(--accent)}



/* ============ ORB CARDS ============ */



.orbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}



.orb-card{



  background:linear-gradient(180deg,#171b29,#10131d);border:1px solid var(--border);border-radius:var(--r-lg);



  padding:18px 10px 14px;text-align:center;transition:transform .15s, border-color .2s;



  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 10px 26px rgba(0,0,0,.3)



}



.orb-card:active{transform:scale(.96)}



.orb-card:hover{border-color:#39415a}



.orb{width:56px;height:56px;border-radius:50%;margin:0 auto 10px}



.orb-card .t{font-weight:800;font-size:1.02rem}



.orb-card .s{font-size:.74rem;color:var(--ink-2);margin-top:2px}



/* ============ GROUP HEADER (Push/Pull/Legs pages) ============ */



.ghead{



  border-radius:var(--r-lg);padding:16px;margin-top:12px;



  background:linear-gradient(140deg, color-mix(in srgb, var(--gcolor, #242a3b) 15%, #12151f), #10131d 68%);



  border:1px solid color-mix(in srgb, var(--gcolor, #242a3b) 32%, var(--border));



  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 30px rgba(0,0,0,.3)



}



.ghead .row{display:flex;align-items:center;gap:12px}



.ghead .orb{width:44px;height:44px;margin:0}



.ghead h2{margin:0;font-size:1.5rem}



.ghead h2 small{font-size:.85rem;font-weight:600;color:var(--ink-2);display:block;letter-spacing:0}



.ghead .note{margin-top:10px;font-size:.8rem;color:var(--ink-2);border-top:1px dashed var(--border);padding-top:10px}



.ghead .note b{color:var(--gcolor,var(--ink))}



.sessions{display:flex;gap:8px;margin-top:12px}



.sessions .pill{



  flex:1;text-align:center;font-size:.78rem;font-weight:700;padding:7px 4px;border-radius:99px;



  background:var(--surface-3);border:1px solid var(--border);color:var(--ink-2);



  cursor:pointer;transition:all .15s



}



.sessions .pill b{color:var(--ink)}



.sessions .pill.on{



  background:color-mix(in srgb, var(--gcolor,#d9f74a) 18%, var(--surface-3));



  border-color:color-mix(in srgb, var(--gcolor,#d9f74a) 52%, var(--border));



  color:var(--ink)



}



/* ============ EXERCISE CARD ============ */



.exlist{margin-top:14px;columns:1;column-gap:14px}



.ex{



  background:linear-gradient(180deg,#151927,#10131d);border:1px solid var(--border);border-radius:var(--r-lg);



  padding:14px;position:relative;overflow:hidden;transition:opacity .25s;



  margin-bottom:12px;break-inside:avoid;



  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 10px 26px rgba(0,0,0,.28)



}



.ex::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--gcolor,var(--accent)),transparent 85%)}



.ex.done{opacity:.5}



.ex.done .exname{text-decoration:line-through;text-decoration-color:var(--ink-3)}



.exhead{display:flex;gap:10px;align-items:flex-start}



.exnum{



  flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;



  background:var(--gsoft,var(--surface-3));color:var(--gcolor,var(--ink));font-weight:800;font-size:.82rem



}



.exmain{flex:1;min-width:0}



.exname{font-weight:800;font-size:1.02rem;line-height:1.25}



.exen{font-size:.74rem;color:var(--ink-3);margin-top:1px}



.excheck{



  flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--border);



  display:grid;place-items:center;font-size:1rem;color:transparent;transition:all .18s



}



.excheck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 16px rgba(217,247,74,.4)}



.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}



.slotlbl{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gcolor,var(--ink-3));opacity:.85;margin-bottom:2px}



.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}



.vchip{



  font-size:.73rem;font-weight:700;padding:5px 12px;border-radius:99px;



  background:var(--surface-3);border:1px solid var(--border);color:var(--ink-2);transition:all .15s



}



.vchip.on{



  background:color-mix(in srgb, var(--gcolor,#d9f74a) 20%, var(--surface-3));



  border-color:color-mix(in srgb, var(--gcolor,#d9f74a) 55%, var(--border));



  color:var(--ink)



}



.vchip:active{transform:scale(.95)}



.chip{



  font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:99px;



  background:var(--surface-3);border:1px solid var(--border);color:var(--ink-2)



}



.chip.reps{background:var(--gsoft,var(--surface-3));color:var(--gcolor,var(--ink));border-color:transparent}



.chip.rest{color:var(--ink-2)}



.chip.eq{color:var(--ink-2)}



.exbody{display:flex;gap:12px;margin-top:12px;align-items:flex-start}



.exfig{



  flex:0 0 auto;display:flex;gap:5px;background:#0d101a;



  border:1px solid var(--border-soft);border-radius:var(--r-md);padding:7px 6px



}



.exfig svg{display:block}



.exinfo{flex:1;min-width:0}



.mchips{display:flex;flex-wrap:wrap;gap:5px}



.mchip{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:99px}



.mchip.p{background:rgba(255,75,85,.16);color:#ff8d94}



.mchip.s{background:rgba(255,159,67,.14);color:#ffb873}



.tip{font-size:.78rem;color:var(--ink-2);margin-top:8px;line-height:1.45}



.tip b{color:var(--ink);font-weight:600}



.alt{font-size:.74rem;color:var(--ink-3);margin-top:5px}



.exacts{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}



.exvideo{margin-top:10px}



.exvideo .vrow{display:flex;gap:8px}



.exvideo video{width:100%;min-width:0;flex:1;border-radius:12px;border:1px solid var(--border);background:#000}



.exvideo .vcap{font-size:.68rem;color:var(--ink-3);margin-top:5px;text-align:center}



.vfb{font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px;line-height:1.6}



.vfb a{color:var(--pull);text-decoration:none;font-weight:600}



.btn-timer{



  display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink-2);



  background:var(--surface-3);border:1px solid var(--border);border-radius:99px;padding:7px 12px



}



.btn-timer:active{transform:scale(.96)}



.wlog{display:flex;align-items:center;gap:6px;margin-left:auto}



.wlog input{



  width:64px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;



  color:var(--ink);padding:6px 8px;font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums



}



.wlog input::placeholder{color:var(--ink-3)}



.wlog .unit{font-size:.72rem;color:var(--ink-3)}



.wlog .last{font-size:.68rem;color:var(--ink-3);white-space:nowrap}



.wlog .last b{color:var(--an);font-weight:700}



/* ============ LEGEND ============ */



.legend{display:flex;gap:14px;align-items:center;margin:14px 2px 0;font-size:.72rem;color:var(--ink-2)}



.wulist{margin-top:8px}



.wurow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--border-soft)}



.wurow .wuinfo{flex:1;min-width:0}



.wurow .wuinfo b{display:block;font-size:.86rem;font-weight:700;line-height:1.3}



.wurow .wuinfo span{display:block;font-size:.68rem;color:var(--ink-3)}



.wurow .chip{flex:0 0 auto}



.cdsub{font-size:.8rem;font-weight:700;margin-top:13px;color:var(--ink)}



.card h3 .dur{margin-left:auto;font-size:.66rem;font-weight:700;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}



.cdnote{font-size:.76rem;color:var(--ink-3);margin-top:10px;line-height:1.55;border-top:1px dashed var(--border-soft);padding-top:9px}



.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}



/* ============ ĂN (nutrition) ============ */



.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}



.macro{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 6px;text-align:center}



.macro .v{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}



.macro .l{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:1px}



.macro.kcal .v{color:var(--accent)}



.macro.pro .v{color:var(--push)}



.macro.carb .v{color:var(--pull)}

  return sex === 'f' ? 0.94 : 0.96;

/* ===== Deep nutrition engine (Châu Á) ===== */



function nutritionDeep(p, c){



  const isF = p.s === 'f';



  const proPct = Math.round(c.pro * 4 / c.kcal * 100);



  const carbPct = Math.round(c.carb * 4 / c.kcal * 100);



  const fatPct = Math.max(0, 100 - proPct - carbPct);



  const fiber = Math.round(Math.min(40, Math.max(22, p.w * 0.4))); // ~14g/1000kcal floor-ish, capped



  const riceBowls = +(c.carb / 45).toFixed(1); // ~1 chén cơm chín ≈ 40–50g carb



  const chickenG = Math.round(c.pro / 0.27); // ~27g pro / 100g cooked breast



  const mealsN = 4;



  const proPerMeal = Math.round(c.pro / mealsN);



  /* MPS: ~0.4 g/kg/meal or 20–40g; leucine ~2.5–3g ≈ 25–40g high-quality protein */



  const mpsMin = Math.max(20, Math.round(p.w * 0.3));



  const mpsIdeal = Math.max(25, Math.round(p.w * 0.4));



  // Train day: shift +15–25% carb toward peri-workout; rest day: −20–30g carb → +fat or keep



  const trainCarb = c.carb;



  const restCarb = Math.max(80, c.carb - (isF ? 25 : 35));



  const restKcal = Math.max(1200, c.kcal - (trainCarb - restCarb) * 4);



  const restFat = Math.round(c.fat + (trainCarb - restCarb) * 4 / 9);



  // Meal macro split weights (sum=1) — more carb around training



  const hh = parseInt(String(p.time||'05:00').split(':')[0], 10);



  const slot = hh < 6 ? 'early' : (hh < 12 ? 'morning' : 'evening');



  const splits = {



    early:   [{n:'Pre',p:.12,c:.18,f:.08},{n:'Post',p:.28,c:.28,f:.18},{n:'Trưa',p:.28,c:.30,f:.28},{n:'Xế',p:.12,c:.10,f:.18},{n:'Tối',p:.20,c:.14,f:.28}],



    morning: [{n:'Pre',p:.12,c:.16,f:.08},{n:'Post',p:.28,c:.30,f:.18},{n:'Trưa',p:.28,c:.28,f:.28},{n:'Xế',p:.12,c:.12,f:.18},{n:'Tối',p:.20,c:.14,f:.28}],



    evening: [{n:'Sáng',p:.22,c:.22,f:.22},{n:'Trưa',p:.28,c:.28,f:.28},{n:'Pre',p:.14,c:.20,f:.10},{n:'Post',p:.26,c:.22,f:.22},{n:'Đêm',p:.10,c:.08,f:.18}]



  };



  const split = (splits[slot] || splits.morning).map(s=>({



    name: s.n,



    pro: Math.round(c.pro * s.p),



    carb: Math.round(c.carb * s.c),



    fat: Math.round(c.fat * s.f)



  }));



  // Sample day scaled roughly to macros (Vietnamese staples)



  const riceLunch = isF ? '¾ chén' : '1 chén';



  const riceDinner = isF ? '½ chén' : '¾ chén';



  const meatLunch = isF ? '140–160g' : '180–200g';



  const sample = [



    {when:'Sau tập / sáng', dish:`Yến mạch 40–50g + whey 1 scoop + 1 chuối · hoặc ${isF?3:4} trứng + 1–2 lát bánh mì`, approx:`~${Math.round(c.pro*0.28)}P / ${Math.round(c.carb*0.28)}C`},



    {when:'Trưa', dish:`${riceLunch} cơm + ${meatLunch} ức gà/cá/đậu hũ + rau xanh + canh (ít dầu)`, approx:`~${Math.round(c.pro*0.28)}P / ${Math.round(c.carb*0.30)}C`},



    {when:'Xế', dish:'Sữa chua Hy Lạp 150g + hoa quả · hoặc 2 trứng + khoai lang 100g', approx:`~${Math.round(c.pro*0.12)}P`},



    {when:'Tối', dish:`${riceDinner} cơm + cá/đậu phụ + rau · hạn chế chiên`, approx:`~${Math.round(c.pro*0.20)}P / ${Math.round(c.carb*0.14)}C`}



  ];



  const micros = isF ? [



    {k:'Sắt', v:'Ưu tiên thịt đỏ nạc, trứng, rau xanh + vitamin C (ổi/cam) — nữ châu Á hay thiếu sắt khi cut.'},



    {k:'Vitamin D', v:'Ít nắng / da tối hơn → dễ thiếu D; cân nhắc kiểm tra máu nếu mệt kéo dài.'},



    {k:'Canxi', v:'Sữa/yogurt/đậu phụ + rau xanh; quan trọng khi calo thấp.'},



    {k:'Omega-3', v:'Cá thu/basa/hồi 2–3 buổi/tuần hoặc dầu cá nếu ít ăn cá.'},



    {k:'Natri (VN nóng)', v:'Ngày tập ra nhiều mồ hôi: thêm chút muối/điện giải — đừng cắt muối cực đoan.'}



  ] : [



    {k:'Vitamin D', v:'Làm việc trong nhà phổ biến ở VN/ĐNÁ → thiếu D liên quan mệt & testosterone thấp hơn tối ưu.'},



    {k:'Omega-3', v:'Cá biển 2–3 buổi/tuần giúp viêm & mỡ máu — quan trọng khi BMI châu Á ≥23.'},



    {k:'Chất xơ', v:`Mục tiêu ~${fiber}g/ngày (rau + đậu) để no lâu khi recomp/cut.`},



    {k:'Natri / điện giải', v:'Khí hậu nóng: bù nước + muối nhẹ quanh buổi tập, tránh chuột rút.'},



    {k:'Rượu / trà sữa', v:'1 ly trà sữa ~300–500 kcal — thủ phạm “bí mật” phá deficit châu Á đô thị.'}



  ];



  const pitfalls = [



    'Cơm “ước” bằng mắt: 1 chén thêm ≈ +45g carb (~180 kcal). Đo 1–2 tuần đầu.',



    'Dầu xào/chiên: 1 thìa dầu ≈ 120 kcal — thường làm vượt fat mà không hay.',



    'Nước ngọt / trà sữa / bia cuối tuần phá cả tuần deficit.',



    'Ăn chay/thiếu thịt nhưng không bù đậu + trứng + whey → protein thực tế chỉ 60–80g.',



    'Cut quá sâu (−25%+) với khung châu Á: mất cơ + mệt + dễ ăn bù.'



  ];



  const plateau = [



    'Cân đứng yên 2–3 tuần: kiểm tra tuân thủ (cơm, dầu, đồ uống) trước khi giảm thêm kcal.',



    'Giảm thêm 100–150 kcal hoặc +2–3k bước/ngày — không cắt thẳng −500.',



    'Tăng protein lên cận trên (nam ~2.3 · nữ ~2.2 g/kg) khi cut để giữ cơ.',



    'Đo vòng eo: nếu eo giảm mà cân đứng = đang recomp (tốt).',



    'Deload + ngủ đủ 1 tuần nếu tập nặng nhưng không tiến bộ.'



  ];



  return {



    proPct, carbPct, fatPct, fiber, riceBowls, chickenG,



    proPerMeal, mpsMin, mpsIdeal, split, sample,



    trainCarb, restCarb, restKcal, restFat, micros, pitfalls, plateau, slot



  };



}

  const lunchProt = isF ? '120–160g' : '150–200g';



  const dinnerRice = isF ? '½–¾ chén cơm' : '¾–1 chén cơm';



  const blocks = {



    early:[



      {time:'4:15 – 4:40', title:'🍌 Bữa nhẹ trước tập', tag:'Trước tập',



       detail:`Carb nhanh (½ chuối / 1 lát bánh mì) + ${prePro} whey hoặc cà phê đen. Không no bụng.`},



      {time:'6:30 – 7:00', title:'🍳 Phục hồi sau tập', tag:'Sau tập',



       detail:`${postPro} protein + carb (yến mạch / trứng / xôi). Bù nước + muối nhẹ.`},



      {time:'12:00 – 12:30', title:'🍚 Bữa trưa', tag:'Bữa chính',



       detail:`Cơm + ${lunchProt} thịt/cá/đậu hũ + rau nhiều. Ưu tiên ức gà, cá, trứng.`},

function hydrationText(p){



  const low = (p.w * 0.03).toFixed(1), high = (p.w * 0.04).toFixed(1);



  const hh = parseInt(String(p.time||'05:00').split(':')[0], 10);



  const timing = hh < 6



    ? 'Tập sáng sớm: uống 300–500ml lúc dậy, nhấp nhỏ khi tập, bù 0,5–0,7L sau tập.'



    : hh >= 15



      ? 'Tập chiều/tối: chia nước đều ban ngày; tránh uống dồn 1L sát giờ ngủ.'



      : 'Tập sáng: uống đủ trước khi ra khỏi nhà; sau tập bù thêm 0,5–0,7L.';



  return `Nền tảng 30–40 ml/kg → khoảng ${low}–${high} L/ngày cho ${p.w} kg. Ngày tập / trời nóng: thêm 0,5–1L + điện giải nhẹ. ${timing} Dấu hiệu đủ nước: nước tiểu vàng nhạt.`;



}



function asianRefRows(){



  const goal = GOALS.find(g=>g.id==='recomp') || GOALS[0];



  const rows = [



    {s:'m', w:55, h:168, label:'Nam nhỏ khung'},



    {s:'m', w:65, h:170, label:'Nam trung bình'},



    {s:'m', w:75, h:172, label:'Nam chắc / tập đều'},



    {s:'m', w:85, h:175, label:'Nam nặng hơn'},



    {s:'f', w:45, h:155, label:'Nữ nhỏ khung'},



    {s:'f', w:52, h:158, label:'Nữ trung bình'},



    {s:'f', w:58, h:160, label:'Nữ tập đều'},



    {s:'f', w:65, h:162, label:'Nữ chắc / nặng hơn'}



  ];



  return rows.map(r=>{



    const bmrRaw = r.s==='m' ? 10*r.w+6.25*r.h-5*25+5 : 10*r.w+6.25*r.h-5*25-161;



    const bmr = Math.round(bmrRaw * asianBmrAdj(r.s));



    const tdee = Math.round(bmr * 1.375);



    const kcal = Math.round(tdee * 0.95 / 50) * 50;



    const pro = Math.round(r.w * goalProteinKg(goal, r.s) / 5) * 5;



    return {s:r.s, w:r.w, label:r.label, kcal, pro};



  });



}

/* MuscleWiki đặt tên file không nhất quán (male-Cables-cable-x vs male-cable-x).



   Sinh danh sách URL ứng viên rồi thử lần lượt, hỏng hết mới hiện hộp link.



   Hồ sơ chọn "Nữ" thì ưu tiên thử toàn bộ biến thể female- trước, không có mới rơi về male-



   (MuscleWiki không quay đủ model nữ cho mọi bài, nên male- luôn là lưới an toàn cuối cùng). */



const EQ_PREFIX = {



  cable:['Cables','Cable'], dumbbell:['Dumbbells','Dumbbell'], barbell:['Barbell','Barbells'],



  machine:['Machine','Machines'], bodyweight:['Bodyweight'], smith:['Smithmachine','Smith'],



  kettlebell:['Kettlebells','Kettlebell'], band:['Bands','Band']



};



function vidCandidates(url){



  const m = String(url).match(/^(.*\/)male-(.+?)(-front|-side)\.mp4$/);



  if(!m) return [url];



  const base = m[1], body = m[2], ang = m[3];



  const bodies = [body];



  const addBody = s=>{ if(bodies.indexOf(s)<0) bodies.push(s); };



  const stripped = body.replace(/^[A-Z][A-Za-z]*-/,'');



  if(stripped !== body) addBody(stripped);



  (EQ_PREFIX[stripped.split('-')[0].toLowerCase()]||[]).forEach(p=>addBody(p+'-'+stripped));



  addBody(body.toLowerCase());



  const genders = profile.s==='f' ? ['female','male'] : ['male'];



  const out = [];



  genders.forEach(g=>bodies.forEach(b=>{ const u = base+g+'-'+b+ang+'.mp4'; if(out.indexOf(u)<0) out.push(u); }));



  return out;



}



function mountVideos(box, onAllDead){



  const vs = box.querySelectorAll('video[data-src0]');



  let dead = 0;



  vs.forEach(v=>{



    const list = vidCandidates(v.dataset.src0);



    let i = 0;



    v.addEventListener('error', ()=>{



      if(++i < list.length){ v.src = list[i]; v.load(); }



      else if(++dead >= vs.length) onAllDead();



    });



    v.src = list[0];



  });



}



/* Một số bài MuscleWiki đặt tên file nữ khác hẳn nam — dùng videoF/videoSideF khi có. */



function vidsOf(ex){



  if(profile.s==='f' && ex.videoF){



    return [ex.videoF].concat(ex.videoSideF ? [ex.videoSideF] : []);



  }



  return [ex.video].concat(ex.videoSide ? [ex.videoSide] : []).filter(Boolean);



}

        warn(`SESSIONS.${k}.${ses}.order không phải hoán vị đủ của 0..${n-1}: [${S.order}]`);



      Object.keys(S.schemes||{}).forEach(key=>{ if(!seen.has(+key)) warn(`SESSIONS.${k}.${ses}.schemes["${key}"] không nằm trong order`); });

    DATA[k].forEach((slot,i)=>{

      slot.variants.forEach(v=>{

        shorts.add(sh);



      });



    });



  });



})();

function shapeSvg(s, mirrored){



  const rot = s.rot;



  let el='';



  if(s.t==='c'){



    const cx = mirrored? 120-s.cx : s.cx;



    el = `<circle cx="${cx}" cy="${s.cy}" r="${s.r}"/>`;



  }else if(s.t==='e'){



    const cx = mirrored? 120-s.cx : s.cx;



    const r  = rot? (mirrored? -rot : rot) : 0;



    el = `<ellipse cx="${cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}"${r?` transform="rotate(${r} ${cx} ${s.cy})"`:''}/>`;



  }else if(s.t==='r'){



    if(mirrored){



      const x = 120-(s.x+s.w);



      const tr = rot? ` transform="rotate(${-rot[0]} ${120-rot[1]} ${rot[2]})"` : '';



      el = `<rect x="${x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${s.rx}"${tr}/>`;



    }else{



      const tr = rot? ` transform="rotate(${rot[0]} ${rot[1]} ${rot[2]})"` : '';



      el = `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${s.rx}"${tr}/>`;



    }



  }else{



    el = `<path d="${s.d}"${mirrored?` transform="translate(120,0) scale(-1,1)"`:''}/>`;



  }



  return el;



}



function shapeBoth(s){ return shapeSvg(s,false) + (s.mirror? shapeSvg(s,true):''); }



function figureSvg(view, primary, secondary, w){



  const V = FIG[view];



  const h = Math.round(w*2);



  let out = `<svg class="figure" viewBox="0 0 120 240" width="${w}" height="${h}" aria-hidden="true">`;



  out += `<g class="bodyfill">` + V.sil.map(shapeBoth).join('') + `</g>`;



  for(const [id, shapes] of Object.entries(V.muscles)){



    const cls = primary.includes(id) ? 'msc p' : (secondary.includes(id) ? 'msc s' : 'msc');



    out += `<g class="${cls}">` + shapes.map(shapeBoth).join('') + `</g>`;



  }



  out += `</svg>`;



  return out;



}



function figurePair(primary, secondary, w){



  return `<div>



    ${figureSvg('front', primary, secondary, w)}



    <div style="text-align:center;font-size:.56rem;letter-spacing:.14em;color:var(--ink-3);font-weight:700">TRƯỚC</div>

}

const VIDBANK = {};



function rebuildVidBank(){



  Object.keys(VIDBANK).forEach(k=>delete VIDBANK[k]);



  if(!PREHAB) return;



  ['push','pull','legs'].forEach(k=>{



    (PREHAB[k].activation||[]).forEach((m,i)=>{ VIDBANK['wu-'+k+'-'+i]=m; });



    (PREHAB[k].activationF||[]).forEach((m,i)=>{ VIDBANK['wu-'+k+'-f-'+i]=m; });



    (PREHAB[k].stretches ||[]).forEach((m,i)=>{ VIDBANK['st-'+k+'-'+i]=m; });



    ((PREHAB.extra&&PREHAB.extra.abs)   ||[]).forEach((m,i)=>{ VIDBANK['abs-'+k+'-'+i]=m; });



    ((PREHAB.extra&&PREHAB.extra.cardio)||[]).forEach((m,i)=>{ VIDBANK['cds-'+k+'-'+i]=m; });



  });



}



rebuildVidBank();



function wuMoves(key){



  const P = PREHAB && PREHAB[key];



  if(!P) return [];



  const base = (P.activation||[]).map((m,i)=>['wu-'+key+'-'+i, m]);



  if(profile.s==='f' && P.activationF && P.activationF.length){



    return base.concat(P.activationF.map((m,i)=>['wu-'+key+'-f-'+i, m]));



  }



  return base;



}



function absToday(){



  if(!PREHAB || !PREHAB.extra) return [];



  const pool = PREHAB.extra.abs || [];



  if(pool.length < 2) return pool.map((m,i)=>[m,i]);



  const d = new Date();



  const doy = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);



  const a = doy % pool.length;



  let b = (doy*7 + 3) % pool.length;



  if(b === a) b = (b + 1) % pool.length;



  return [[pool[a],a],[pool[b],b]];



}

}

function getAiMenuCache(p, c){

}



function saveAiMenuCache(partial, p, c){



  const fp = aiMenuFingerprint(p, c);



  const prev = store.get('aiMenu', {}) || {};



  const next = Object.assign({}, prev.fp===fp ? prev : {fp}, partial, {fp, at: Date.now()});



  store.set('aiMenu', next);



  return next;



}



function clearAiMenuCache(){ store.set('aiMenu', null); }



function extractJsonObject(raw){
  let s = String(raw||'').trim();
  s = s.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/m,'').trim();
  try { return JSON.parse(s); } catch (e0) {}
  const start = (()=>{ for(let i=0;i<s.length;i++){ if(s[i]==='{'||s[i]==='[') return i; } return -1; })();
  if(start < 0) throw new Error('Gemini không trả JSON hợp lệ');
  const open = s[start], close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < s.length; i++){
    const ch = s[i];
    if(inStr){
      if(esc){ esc = false; continue; }
      if(ch === '\\'){ esc = true; continue; }
      if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"'){ inStr = true; continue; }
    if(ch === open) depth++;
    else if(ch === close){
      depth--;
      if(depth === 0){
        const slice = s.slice(start, i + 1);
        try { return JSON.parse(slice); }
        catch (e1) { throw new Error('JSON Gemini lỗi: ' + (e1.message||e1)); }
      }
    }
  }
  throw new Error('JSON Gemini bị cắt / không đủ ngoặc');
}
async function geminiGenerate(prompt){



  const key = getGeminiKey();



  if(!key) throw new Error('Chưa có Gemini API key — mở Cài đặt để nhập');



  let lastErr = null;



  for(const model of GEMINI_MODELS){



    const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key);



    const body = {



      contents:[{parts:[{text:prompt}]}],



      generationConfig:{ temperature:0.9, maxOutputTokens:2048, responseMimeType:'application/json' }



    };



    let res;



    try{ res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); }



    catch(e){ lastErr = e; continue; }



    const data = await res.json().catch(()=>({}));



    if(!res.ok){



      const msg = (data.error && data.error.message) || ('HTTP '+res.status);



      lastErr = new Error(msg);



      if(res.status===404 || /no longer available|not found/i.test(msg)) continue;



      if(res.status===429) continue;



      throw lastErr;



    }



    const parts = (((data.candidates||[])[0]||{}).content||{}).parts || [];



    const textOut = parts.map(p=>p.text||'').join('').trim();



    if(!textOut){ lastErr = new Error('Gemini empty '+model); continue; }



    return {model, text: textOut, json: extractJsonObject(textOut)};



  }



  throw lastErr || new Error('Không gọi được Gemini');



}

async function regenerateAiSample(){



  const c = calc();



  const out = await geminiGenerate(buildAiSamplePrompt(profile, c));



  const sample = (out.json && out.json.sample) || [];



  if(!Array.isArray(sample) || sample.length < 3) throw new Error('JSON thực đơn mẫu không đủ bữa');



  const norm = sample.slice(0,6).map(s=>({

function planPace(c, p){



  /* ~7700 kcal ≈ 1 kg mô mỡ; châu Á dễ dao động nước — báo khoảng + lưu ý */



  const dailyDelta = c.kcal - c.tdee;



  const weekKg = +(dailyDelta * 7 / 7700).toFixed(2);



  const abs = Math.abs(weekKg);



  let pace;



  if(Math.abs(dailyDelta) < 80) pace = 'Gần duy trì — cân dao động ±0,2–0,5 kg/tuần do nước/muối là bình thường.';



  else if(weekKg < 0) pace = `Thiếu khoảng ${Math.abs(dailyDelta)} kcal/ngày → ước giảm ~${abs} kg/tuần (mỡ + nước). Châu Á: ưu tiên theo dõi vòng eo hơn mỗi số cân.`;



  else pace = `Thừa khoảng ${dailyDelta} kcal/ngày → ước tăng ~${abs} kg/tuần. Giữ tăng ≤0,25–0,5 kg/tuần để hạn chế mỡ.`;



  const sexTip = p.s==='f'



    ? 'Nữ: cân có thể nhảy ±1–2 kg quanh chu kỳ — nhìn trung bình 2–4 tuần. Tăng tạ thường +1–2,5 kg/bước nhỏ hơn nam.'



    : 'Nam châu Á: cùng BMI vẫn dễ mỡ tạng hơn — đo vòng eo rốn 1 lần/tuần (sáng, đói). Tăng compound +2,5 kg (thân trên) / +5 kg (chân).';



  return {dailyDelta, weekKg, pace, sexTip};



}



function planPhase(){



  const n = Object.keys(weekHist).length;



  if(n <= 1) return {idx:0, label:'W1 · Làm quen'};



  if(n === 2) return {idx:1, label:'W2 · Vào guồng'};



  if(n <= 4) return {idx:2, label:'W3–4 · Tăng tải lần 1'};



  if(n <= 6) return {idx:3, label:'W5–6 · Tăng tải lần 2'};



  if(n === 7) return {idx:4, label:'W7 · Deload'};



  return {idx:5, label:'W8+ · Đo kết quả / chu kỳ mới'};



}

let members = store.get('members', []);



let meId    = store.get('me', '');



function saveMembers(){ store.set('members', members); }



function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }



function memberFind(id){ return members.find(m=>m.id===id) || null; }



/* Ghi hồ sơ hiện tại thành 1 thành viên. Trùng tên (không phân biệt hoa/thường)



   thì cập nhật bản ghi cũ thay vì tạo trùng lặp. */



function upsertMember(p, targetId){



  const nm = (p.name||'').trim();



  if(!nm) return null;                       // chưa có tên thì không lưu vào CSDL



  const now = new Date().toISOString();



  /* targetId: đang bấm "Sửa" một thành viên cụ thể. Không có thì ưu tiên



     bản ghi của thiết bị này, rồi tới bản ghi trùng tên. */



  let m = targetId ? memberFind(targetId) : (meId ? memberFind(meId) : null);



  if(!m) m = members.find(x=>(x.name||'').toLowerCase() === nm.toLowerCase()) || null;



  const snap = {name:nm, h:p.h, w:p.w, a:p.a, s:p.s, act:p.act, time:p.time, goal:p.goal};



  if(m){



    Object.assign(m, snap, {updatedAt:now});



  }else{



    m = Object.assign({id:newId(), createdAt:now, updatedAt:now, note:''}, snap);



    members.push(m);



  }



  saveMembers();



  return m;



}



function isoWeek(d){



  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));



  const day = dt.getUTCDay() || 7;



  dt.setUTCDate(dt.getUTCDate() + 4 - day);



  const y0 = new Date(Date.UTC(dt.getUTCFullYear(),0,1));



  const wk = Math.ceil(((dt - y0)/86400000 + 1)/7);



  return dt.getUTCFullYear() + '-W' + String(wk).padStart(2,'0');



}



function rolloverWeek(){



  const wk = isoWeek(new Date());



  if(checks.week !== wk){



    if(checks.week){ weekHist[checks.week] = {done: Object.keys(checks.done).length, total: totalEx(), at: Date.now()}; store.set('history', weekHist); }



    checks = {week:wk, done:{}};



    store.set('checks', checks);



  }



}



/* ================= CALCULATIONS ================= */



const R = (n)=>Math.round(n);



function calc(who){



  const p = who || profile;



  const bmi = p.w / Math.pow(p.h/100, 2);



  const bmrRaw = p.s==='m' ? 10*p.w + 6.25*p.h - 5*p.a + 5 : 10*p.w + 6.25*p.h - 5*p.a - 161;



  const adj = asianBmrAdj(p.s);



  const bmr = bmrRaw * adj; // điều chỉnh REE châu Á (thường thấp hơn công thức Caucasian)



  const tdee = bmr * p.act;



  const goal = GOALS.find(g=>g.id===p.goal) || GOALS.find(g=>g.id==='recomp') || GOALS[0];



  const proKg = goalProteinKg(goal, p.s);



  const fatKg = goalFatKg(goal, p.s);



  const kcal = Math.round(tdee * (1 + goal.calorieAdjustPct/100) / 50) * 50;



  const pro = Math.round(p.w * proKg / 5) * 5;



  const fat = Math.round(p.w * fatKg);



  const carb = Math.max(0, Math.round((kcal - pro*4 - fat*9)/4));



  /* BMI WHO Asia-Pacific: bình thường <23, thừa cân ≥23, béo phì ≥25 */



  let bmiTag = 'Bình thường (WHO Asia)';



  if(bmi < 18.5) bmiTag = 'Thiếu cân';



  else if(bmi >= 25) bmiTag = 'Béo phì (WHO Asia ≥25)';



  else if(bmi >= 23) bmiTag = 'Thừa cân (WHO Asia ≥23)';



  return {



    bmi:+bmi.toFixed(1), bmiTag,



    bmrRaw:R(bmrRaw), bmrAdj:adj, bmr:R(bmr), tdee:R(tdee),



    kcal, pro, fat, carb, proKg, fatKg, goal



  };



}



/* Nữ giới có tỉ lệ sợi cơ loại I cao hơn nên chịu mệt tốt hơn ở cùng %1RM (meta-regression



   Refalo et al. 2023, PMC10933212) — nới nhẹ mép trên rep range +2 cho bài isolation.



   Không áp cho compound nặng (restSec>=120s: Squat/Deadlift/Bench...) vì đó cần chuẩn kỹ thuật/sức mạnh,



   khác biệt giới tính ở đây không đủ lớn để đổi rep range. Không áp cho bài giữ theo giây (Plank...). */



function femaleAdjustReps(scheme, ex){



  if(!scheme || ex.restSec>=120) return scheme;



  const m = String(scheme).match(/^(\d+)\s*×\s*(\d+)-(\d+)(.*)$/);



  if(!m || /giây/.test(m[4])) return scheme;



  return `${m[1]} × ${m[2]}-${+m[3]+2}${m[4]}`;



}



function repsOf(ex, goal){



  const scheme = goal.repMode==='fatloss' ? ex.fatloss : ex.hypertrophy;



  return profile.s==='f' ? femaleAdjustReps(scheme, ex) : scheme;



}



function restOf(ex, goal){ return goal.repMode==='fatloss' ? (ex.restSec>=120? 120 : 60) : ex.restSec; }



function fmtRest(s){ return s>=60 ? (s%60===0? (s/60)+' phút' : Math.floor(s/60)+'p'+(s%60)) : s+' giây'; }

function endTime(){



  let [h,m] = (profile.time||'05:00').split(':').map(Number);



  if(!Number.isFinite(h)||!Number.isFinite(m)){ h=5; m=0; }



  const t = h*60+m+90; return String(Math.floor(t/60)%24).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');



}

function eqShort(eq){



  return ({Barbell:'Thanh đòn', Dumbbell:'Tạ đơn', Cable:'Cáp', Machine:'Máy', Bodyweight:'Không tạ'})[eq] || eq;



}



function autoSession(){ const t = todayIdx(); return (t>=3 && t<=5) ? 's2' : 's1'; }



function variantOf(id){



  const key = id.replace(/\d+$/,''), idx = +id.match(/\d+$/)[0];



  const slot = DATA[key][idx];



  const vi = Math.min(vsel[id]||0, slot.variants.length-1);



  return {slot, ex:slot.variants[vi], vi, key, idx};



}

/* check + ghi mức tạ (event delegation) */



document.addEventListener('click', e=>{



  const chk = e.target.closest('[data-check]');



  if(chk){



    const id = chk.dataset.check;



    if(checks.done[id]) delete checks.done[id]; else checks.done[id] = Date.now();



    store.set('checks', checks);



    const card = chk.closest('.ex');



    card.classList.toggle('done', !!checks.done[id]);



    chk.classList.toggle('on', !!checks.done[id]);



    chk.setAttribute('aria-pressed', !!checks.done[id]);



    renderProgress();



    const total = totalEx(), done = Object.keys(checks.done).length;



    if(done === total) toast('🎉 Hoàn thành cả tuần — quá đỉnh!');



    else if(checks.done[id]) toast('✅ Đã xong: còn ' + (total-done) + ' bài');



  }



  const tm = e.target.closest('[data-timer]');



  if(tm) openTimer(+tm.dataset.timer, tm.dataset.name);



  const vc = e.target.closest('[data-var]');



  if(vc){



    const id = vc.dataset.var;



    vsel[id] = +vc.dataset.vi;



    store.set('vsel', vsel);



    renderGroup(id.replace(/\d+$/,''));



  }



  const sp = e.target.closest('[data-ses]');



  if(sp){



    groupSession[sp.dataset.ses] = sp.dataset.s;



    saveGroupSession();



    renderGroup(sp.dataset.ses);



    renderProgress();



  }



  const vb = e.target.closest('[data-vid]');



  if(vb){



    const id = vb.dataset.vid;



    const ex = variantOf(id).ex;



    const box = document.getElementById('vid-'+id);



    if(!box.hidden){ box.hidden = true; box.innerHTML=''; vb.innerHTML = ico('play',13)+' Cách tập'; return; }



    box.hidden = false; vb.innerHTML = ico('chevup',13)+' Đóng video';



    const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.nameEn + ' proper form');



    const fallback = `<div class="vfb">${ico('info',13)} Không tải được video (cần kết nối mạng).<br>` +



      (ex.page? `<a href="${ex.page}" target="_blank" rel="noopener">↗ Xem trên MuscleWiki</a> · ` : '') +



      `<a href="${yt}" target="_blank" rel="noopener">↗ Tìm video trên YouTube</a></div>`;



    if(ex.video || ex.videoF){



      const vids = vidsOf(ex);



      box.innerHTML = `<div class="vrow">${vids.map(v=>`<video data-src0="${v}" autoplay loop muted playsinline preload="auto"></video>`).join('')}</div>` +



        `<div class="vcap">Video: MuscleWiki — góc ${vids.length>1?'trước & nghiêng':'trước'} · cần mạng để tải</div>`;



      mountVideos(box, ()=>{ box.innerHTML = fallback; });



    } else box.innerHTML = fallback;



  }



  const v2 = e.target.closest('[data-vid2]');



  if(v2){



    const k = v2.dataset.vid2, m = VIDBANK[k];



    const box = document.getElementById('vid2-'+k);



    if(box && m){



      if(!box.hidden){ box.hidden = true; box.innerHTML = ''; }



      else {



        box.hidden = false;



        const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(m.nameEn + ' how to');



        const fb = `<div class="vfb">${ico('info',13)} Không tải được video (cần mạng). ` +



          (m.page? `<a href="${m.page}" target="_blank" rel="noopener">↗ MuscleWiki</a> · ` : '') +



          `<a href="${yt}" target="_blank" rel="noopener">↗ YouTube</a></div>`;



        if(m.video || m.videoF){



          const vids = vidsOf(m);



          box.innerHTML = `<div class="vrow">${vids.map(v=>`<video data-src0="${v}" autoplay loop muted playsinline preload="auto"></video>`).join('')}</div>` +



            `<div class="vcap">💡 ${esc(m.tip||'')}</div>`;



          mountVideos(box, ()=>{ box.innerHTML = fb; });



        } else box.innerHTML = fb;



      }



    }



  }



});



document.addEventListener('change', e=>{



  const w = e.target.closest('[data-w]');



  if(w && w.value !== '' && Number.isFinite(+w.value) && +w.value >= 0){



    const id = w.dataset.w;



    const prev = exW[id];



    exW[id] = +w.value;



    store.set('exw', exW);



    const lastEl = w.parentElement.querySelector('.last');



    lastEl.innerHTML = `Lần trước: <b>${exW[id]}kg</b>`;



    if(prev != null && +w.value > prev) toast(`💪 +${(+w.value - prev).toFixed(1).replace('.0','')}kg so với lần trước!`);



    else toast('Đã lưu mức tạ ' + w.value + 'kg');



    w.value = '';



  }



});

  const phase = planPhase();



  const sexLabel = profile.s==='m' ? 'Nam' : 'Nữ';



  const goalCards = GOALS.map(g=>`



    <button class="goalopt${g.id===profile.goal?' sel':''}" data-goal-quick="${g.id}">



      <div class="t">${ico(g.icon,15)} ${g.nameVi}</div>

  const road = ROADMAP.map((w,i)=>`



    <div class="wk${i===phase.idx?' on':''}">

  const histKeys = Object.keys(weekHist).sort().slice(-8);



  const histHtml = histKeys.length ? `

          const pct = total ? Math.min(100, done/total*100) : 0;



          return `<div style="flex:1;text-align:center">



            <div style="height:48px;display:flex;align-items:flex-end">



              <div style="width:100%;border-radius:5px 5px 2px 2px;background:${pct>=100?'var(--accent)':'var(--surface-3)'};height:${Math.max(6,pct*0.48)}px"></div>

  $('#sec-plan').innerHTML = `

function fmtDate(iso){



  try{ const d = new Date(iso); return d.toLocaleDateString('vi-VN') + ' ' + d.toTimeString().slice(0,5); }



  catch(e){ return '—'; }



}

document.addEventListener('change', e=>{

  const f = e.target.files[0]; if(!f) return;



  const r = new FileReader();



  r.onload = ()=>{



    try{



      const d = JSON.parse(r.result);



      const list = Array.isArray(d) ? d : (d.members || []);



      if(!Array.isArray(list)) throw 0;



      let added = 0;



      list.forEach(x=>{



        if(!x || !x.name) return;



        if(members.some(m=>(m.name||'').toLowerCase() === String(x.name).toLowerCase())) return;



        members.push({



          id: x.id || newId(), name: String(x.name).slice(0,24),



          h:+x.h||170, w:+x.w||65, a:+x.a||25, s: x.s==='f'?'f':'m',



          act:+x.act||1.375, time:x.time||'05:00', goal:x.goal||'recomp',



          createdAt:x.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString(), note:x.note||''



        });



        added++;



      });



      saveMembers(); renderTV();



      toast(added? ('⬆️ Đã nhập ' + added + ' thành viên') : 'Không có thành viên mới để nhập');



    }catch(err){ toast('File JSON không hợp lệ'); }



    e.target.value = '';



  };



  r.readAsText(f);



});

/* ---- biểu đồ cân nặng: 1 chuỗi, đường + vùng, lưới mờ, điểm cuối nhấn, tooltip ---- */



function drawBwChart(){



  const el = $('#bwChart');



  if(!el) return;



  if(bodylog.length < 2){



    el.innerHTML = `<p style="font-size:.8rem;color:var(--ink-3);margin-top:8px">Ghi từ 2 lần trở lên để thấy biểu đồ xu hướng.</p>`;



    return;



  }



  const W=340, H=150, padL=34, padR=14, padT=12, padB=22;



  const data = bodylog;



  const ws = data.map(d=>d.w);



  let min = Math.min(...ws), max = Math.max(...ws);



  if(max-min < 2){ const mid=(max+min)/2; min=mid-1; max=mid+1; }



  const x = i => padL + (W-padL-padR) * (data.length===1? 0.5 : i/(data.length-1));



  const y = v => padT + (H-padT-padB) * (1-(v-min)/(max-min));



  const pts = data.map((d,i)=>[x(i), y(d.w)]);



  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');



  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${H-padB} L${pts[0][0].toFixed(1)},${H-padB} Z`;



  const gridY = [min, (min+max)/2, max];



  const [lp, ep] = [pts[0], pts[pts.length-1]];



  el.innerHTML = `



  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cân nặng">



    ${gridY.map(v=>`



      <line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#1e2434" stroke-width="1"/>



      <text x="${padL-6}" y="${y(v)+3}" text-anchor="end" font-size="8.5" fill="#5d6478" font-family="inherit">${v.toFixed(1)}</text>`).join('')}



    <path d="${area}" fill="rgba(217,247,74,.09)"/>



    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>



    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.4}" fill="${i===pts.length-1?'var(--accent)':'#39415a'}" ${i===pts.length-1?'stroke="#07090f" stroke-width="1.5"':''}/>`).join('')}



    <text x="${ep[0]}" y="${ep[1]-9}" text-anchor="${ep[0] > W-56 ? 'end':'middle'}" font-size="10" font-weight="700" fill="var(--accent)">${data[data.length-1].w}kg</text>



    <text x="${lp[0]}" y="${H-8}" text-anchor="start" font-size="8" fill="#5d6478">${data[0].d.slice(5)}</text>



    <text x="${ep[0]}" y="${H-8}" text-anchor="end" font-size="8" fill="#5d6478">${data[data.length-1].d.slice(5)}</text>



    <rect id="bwHit" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/>



  </svg>



  <div class="chart-tip" id="bwTip"></div>`;



  const svg = el.querySelector('svg'), tip = $('#bwTip');



  const move = (clientX)=>{



    const r = svg.getBoundingClientRect();



    const px = (clientX - r.left) / r.width * W;



    let bi = 0, bd = 1e9;



    pts.forEach((p,i)=>{ const d=Math.abs(p[0]-px); if(d<bd){bd=d;bi=i;} });



    tip.style.left = (pts[bi][0]/W*100) + '%';



    tip.style.top  = (pts[bi][1]/H*100) + '%';



    tip.innerHTML = `<b>${data[bi].w}kg</b> · ${data[bi].d.slice(5).replace('-','/')}`;



    tip.style.opacity = 1;



  };



  svg.addEventListener('mousemove', e=>move(e.clientX));



  svg.addEventListener('touchmove', e=>{ move(e.touches[0].clientX); }, {passive:true});



  svg.addEventListener('mouseleave', ()=>tip.style.opacity=0);



  svg.addEventListener('touchend',  ()=>tip.style.opacity=0);



}



function renderBwList(){



  const el = $('#bwList');



  if(!el) return;



  el.innerHTML = bodylog.slice().reverse().map((d,ri)=>{



    const i = bodylog.length-1-ri;



    const prev = i>0 ? bodylog[i-1].w : null;



    const diff = prev==null? '' : (d.w-prev===0? '±0' : (d.w>prev?'+':'')+ (d.w-prev).toFixed(1) + 'kg');



    return `<div class="wrow"><span>${d.d}</span><span><b>${d.w}kg</b> <span style="color:${prev!=null&&d.w<prev?'var(--an)':'var(--ink-3)'};font-size:.7rem">${diff}</span></span><button class="del" data-del-bw="${i}" aria-label="Xoá">✕</button></div>`;



  }).join('');



}



/* ================= TIMER ================= */



const RING = 2*Math.PI*104;



let tmrTotal = 90, tmrLeft = 90, tmrInt = null, tmrPaused = false;



function openTimer(sec, name){



  tmrTotal = tmrLeft = sec || 90;



  tmrPaused = false;



  $('#tmrWho').textContent = name ? ('Nghỉ sau: ' + name) : 'Nghỉ giữa hiệp';



  $('#tmrPause').textContent = 'Tạm dừng';



  $('#tmr').classList.add('open');



  tickTimer();



  clearInterval(tmrInt);



  tmrInt = setInterval(()=>{



    if(tmrPaused) return;



    tmrLeft--;



    tickTimer();



    if(tmrLeft<=0){ clearInterval(tmrInt); beep(); if(navigator.vibrate) navigator.vibrate([180,80,180,80,300]); setTimeout(closeTimer, 1200); }



  }, 1000);



}



function tickTimer(){



  const m = Math.floor(Math.max(0,tmrLeft)/60), s = Math.max(0,tmrLeft)%60;



  $('#tmrClock').textContent = m + ':' + String(s).padStart(2,'0');



  $('#tmrRing').style.strokeDashoffset = RING * (1 - Math.max(0,tmrLeft)/tmrTotal);



}



function closeTimer(){ clearInterval(tmrInt); $('#tmr').classList.remove('open'); }



$('#tmrSkip').addEventListener('click', closeTimer);



$('#tmrPause').addEventListener('click', ()=>{



  tmrPaused = !tmrPaused;



  $('#tmrPause').textContent = tmrPaused? 'Tiếp tục' : 'Tạm dừng';



});



$$('.tmr .presets button').forEach(b=>b.addEventListener('click', ()=>{ openTimer(+b.dataset.t, null); }));



$('#tmr').addEventListener('click', e=>{ if(e.target.id==='tmr') closeTimer(); });



function beep(){



  try{



    const ctx = new (window.AudioContext||window.webkitAudioContext)();



    [0,.25,.5].forEach((t,i)=>{



      const o = ctx.createOscillator(), g = ctx.createGain();



      o.connect(g); g.connect(ctx.destination);



      o.frequency.value = i===2? 1320 : 880;



      g.gain.setValueAtTime(.001, ctx.currentTime+t);



      g.gain.exponentialRampToValueAtTime(.28, ctx.currentTime+t+.02);



      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.22);



      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.24);



    });



  }catch(e){}



}

/* ================= NỀN MATRIX (mọi kích thước màn hình, tự tắt khi ẩn tab / reduced-motion) ================= */



(function(){



  const cv = document.getElementById('bgfx');



  if(!cv || !cv.getContext) return;



  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;



  const g = cv.getContext('2d');



  let W, H, raf = null, tick = 0, nodes = [], running = false;



  const NODE_COLS = ['217,247,74','61,165,255','180,92,255'];



  function resize(){



    const dpr = Math.min(1.5, window.devicePixelRatio || 1);



    W = window.innerWidth; H = window.innerHeight;



    cv.width = W*dpr; cv.height = H*dpr;



    cv.style.width = W+'px'; cv.style.height = H+'px';



    g.setTransform(dpr,0,0,dpr,0,0);



    nodes = Array.from({length: 26}, ()=>({



      x:Math.random()*W, y:Math.random()*H,



      vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4,



      r:Math.random()*1.8+1, ph:Math.random()*Math.PI*2,



      c:NODE_COLS[Math.floor(Math.random()*NODE_COLS.length)]



    }));



    g.fillStyle = '#05070d'; g.fillRect(0,0,W,H);



  }



  function frame(){



    tick += 0.016;



    g.fillStyle = 'rgba(8,11,19,0.16)'; g.fillRect(0,0,W,H);



    const BLOBS = [



      {c:'217,247,74', x:.16, y:.08, r:.52, sp:.05},



      {c:'61,165,255', x:.86, y:.3,  r:.46, sp:.04},



      {c:'180,92,255', x:.32, y:.88, r:.5,  sp:.06}



    ];



    for(let i=0; i<BLOBS.length; i++){



      const b = BLOBS[i];



      const bx = (b.x + Math.sin(tick*b.sp + i*2)*0.06)*W;



      const by = (b.y + Math.cos(tick*b.sp*0.8 + i)*0.06)*H;



      const br = b.r*Math.min(W,H);



      const gr = g.createRadialGradient(bx,by,0,bx,by,br);



      gr.addColorStop(0,'rgba('+b.c+',0.028)');



      gr.addColorStop(1,'rgba('+b.c+',0)');



      g.fillStyle = gr; g.fillRect(bx-br,by-br,br*2,br*2);



    }



    const gs = 84, ox = (tick*14)%gs, oy = (tick*10)%gs;



    g.strokeStyle = 'rgba(217,247,74,0.035)'; g.lineWidth = 1;



    for(let x=-gs+ox; x<W+gs; x+=gs){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }



    for(let y=-gs+oy; y<H+gs; y+=gs){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }



    for(let i=0; i<nodes.length; i++){



      const n = nodes[i];



      n.x += n.vx; n.y += n.vy; n.ph += 0.02;



      if(n.x<0) n.x=W; if(n.x>W) n.x=0; if(n.y<0) n.y=H; if(n.y>H) n.y=0;



      for(let j=i+1; j<nodes.length; j++){



        const o = nodes[j], d = Math.hypot(n.x-o.x, n.y-o.y);



        if(d < 120){



          g.beginPath(); g.moveTo(n.x,n.y); g.lineTo(o.x,o.y);



          g.strokeStyle = 'rgba(180,200,100,' + ((1-d/120)*0.2).toFixed(3) + ')';



          g.stroke();



        }



      }



      const p = Math.sin(n.ph)*0.5 + 0.5;



      g.beginPath(); g.arc(n.x, n.y, n.r + p*1.4, 0, Math.PI*2);



      g.fillStyle = 'rgba(' + n.c + ',' + (0.3 + p*0.45).toFixed(2) + ')';



      g.fill();



    }



    raf = requestAnimationFrame(frame);



  }



  function start(){ if(running || reduce) return; running = true; cv.style.display = 'block'; resize(); frame(); }



  function stop(){ if(!running) return; running = false; cancelAnimationFrame(raf); cv.style.display = 'none'; }



  function decide(){ (!document.hidden) ? start() : stop(); }



  window.addEventListener('resize', ()=>{ if(running) resize(); decide(); });



  document.addEventListener('visibilitychange', decide);



  if(mqDesk.addEventListener) mqDesk.addEventListener('change', decide); else if(mqDesk.addListener) mqDesk.addListener(decide);



  decide();



})();</script>
